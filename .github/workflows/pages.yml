name: Deploy site ke GitHub Pages

# Deploy folder site/ ke GitHub Pages. Repo sudah publik sehingga Pages
# tersedia di akun Free. Dipicu push ke site/ atau manual (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: hanya ambil folder site/ (repo kecil, checkout cepat)
      - name: Checkout folder site saja
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            site
          sparse-checkout-cone-mode: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
